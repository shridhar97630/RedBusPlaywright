name: RedBus Automation CI

on:
  push:
    branches: [main]
    paths:
      - "redbus-automation/**"
      - ".github/workflows/redbus-automation.yml"
  pull_request:
    branches: [main]
    paths:
      - "redbus-automation/**"
      - ".github/workflows/redbus-automation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redbus-automation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-and-regression:
    name: Cucumber BDD on Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: redbus-automation
    env:
      CI: true
      BASE_URL: ${{ vars.BASE_URL || 'https://www.redbus.in' }}
      PLAYWRIGHT_PROXY: ${{ secrets.PLAYWRIGHT_PROXY }}
      RED_BUS_CURL_BRIDGE: ${{ vars.RED_BUS_CURL_BRIDGE || 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: redbus-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke scenarios
        run: npm run test:smoke

      - name: Run regression scenarios
        if: always()
        run: npm run test:regression

      - name: Upload reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redbus-automation-reports
          path: |
            redbus-automation/merv-results/
            redbus-automation/merv-report/
            redbus-automation/screenshots/
            redbus-automation/traces/
            redbus-automation/videos/
          if-no-files-found: ignore
          retention-days: 14
